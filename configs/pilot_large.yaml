# Wider target-model population.  The interpreter generalises over *models*, so
# model diversity buys more than extra states per model: 8 seeds x 3 leak
# strengths = 24 targets per domain, 16 of them for fitting.
# Cost: roughly 3x the pilot (the sequence targets dominate the wall clock).
run_name: pilot_large
source_domains: [skirmish]
target_domains: [clinic, seqworld]
seeds: [0, 1, 2, 3, 4, 5, 6, 7]
spurious: [0.0, 1.0, 2.0]
target_n_train: 6000
target_epochs: 60
target_weight_decay: 0.001
target_label_smoothing: 0.05
n_focal: 160
n_probe: 512
holdout_models: 8
feature_ablations: true
data_seed: 0
interpreter:
  epochs: 60
  lr: 0.001
  batch_size: 64
  d_model: 128
  n_layers: 4
  n_heads: 4
  dropout: 0.1
  lambda_vocab: 0.3
  seed: 0
