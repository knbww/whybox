[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mint"
version = "0.1.0"
description = "Meta-interpretability: does an explanation procedure transfer across domains and ontologies?"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.2", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mint = "mint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end runs (deselect with '-m \"not slow\"')"]
filterwarnings = ["ignore::UserWarning"]
